      model: openrouter/openai/gpt-oss-120b
      api_key: os.environ/RAPIDSELECTOR_OPENROUTER_KEY
      max_tokens: 8192
      input_cost_per_token: 0.000000037
      output_cost_per_token: 0.00000017
      extra_body:
        provider:
          order: ["deepinfra/bf16"]
          only: ["deepinfra/bf16"]
