# rapid-selector gateway (LiteLLM). The only list of models: every entry is pinned to one
# OpenRouter endpoint, with fallbacks off and zero data retention required.
# Prices are the pinned endpoint's (USD per token), checked with tests/check-prices.sh.
# LiteLLM records the cost OpenRouter reports when a response carries one; these prices
# are the fallback that keeps spend above zero if it does not.

model_list:
  # --- Roles (permanent use) ---
  - model_name: classify
    litellm_params:
      model: openrouter/mistralai/mistral-small-3.2-24b-instruct
      api_key: os.environ/RAPIDSELECTOR_OPENROUTER_KEY
      max_tokens: 1024
      input_cost_per_token: 0.000000075
      output_cost_per_token: 0.0000002
      extra_body:
        provider:
          order: ["deepinfra/fp8"]
          only: ["deepinfra/fp8"]
          allow_fallbacks: false
          zdr: true
          data_collection: deny
    model_info:
      rapidselector_kind: role
      reasoning: false
  - model_name: summarise
    litellm_params:
      model: openrouter/google/gemma-4-26b-a4b-it
      api_key: os.environ/RAPIDSELECTOR_OPENROUTER_KEY
      max_tokens: 2048
      input_cost_per_token: 0.0000001
      output_cost_per_token: 0.0000003
      extra_body:
        provider:
          order: ["coreweave/bf16"]
          only: ["coreweave/bf16"]
          allow_fallbacks: false
          zdr: true
          data_collection: deny
    model_info:
      rapidselector_kind: role
      reasoning: false
  - model_name: code
    litellm_params:
      model: openrouter/qwen/qwen3-coder-30b-a3b-instruct
      api_key: os.environ/RAPIDSELECTOR_OPENROUTER_KEY
      max_tokens: 8192
      input_cost_per_token: 0.00000007
      output_cost_per_token: 0.00000028
      extra_body:
        provider:
          order: ["siliconflow/fp8"]
          only: ["siliconflow/fp8"]
          allow_fallbacks: false
          zdr: true
          data_collection: deny
    model_info:
      rapidselector_kind: role
      reasoning: false
  - model_name: chat
    litellm_params:
      model: openrouter/openai/gpt-oss-120b
      api_key: os.environ/RAPIDSELECTOR_OPENROUTER_KEY
      max_tokens: 8192
      input_cost_per_token: 0.000000037
      output_cost_per_token: 0.00000017
      extra_body:
        provider:
          order: ["deepinfra/bf16"]
          only: ["deepinfra/bf16"]
          allow_fallbacks: false
          zdr: true
          data_collection: deny
    model_info:
      rapidselector_kind: role
      reasoning: true

  # --- Experiment names (chat and the arena), smallest to largest ---
  - model_name: llama-3.2-1b-instruct@cloudflare
    litellm_params:
      model: openrouter/meta-llama/llama-3.2-1b-instruct
