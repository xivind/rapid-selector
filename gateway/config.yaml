# rapid-selector gateway (LiteLLM). The only list of models: every entry is pinned to one
# OpenRouter endpoint, with fallbacks off and zero data retention required.
# Prices are the pinned endpoint's (USD per token), checked with tests/check-prices.sh.

model_list:
  # --- Roles (permanent use) ---
  - model_name: classify
    litellm_params:
      model: openrouter/mistralai/mistral-small-3.2-24b-instruct
      api_key: os.environ/RAPIDSELECTOR_OPENROUTER_KEY
      max_tokens: 1024
      input_cost_per_token: 0.000000075
      output_cost_per_token: 0.0000002
      extra_body:
        provider:
          order: ["deepinfra/fp8"]
          only: ["deepinfra/fp8"]
          allow_fallbacks: false
          zdr: true
          data_collection: deny
    model_info:
      rapidselector_kind: role
      reasoning: false

litellm_settings:
  max_budget: 32
  budget_duration: 30d
  callbacks: ["prometheus"]
  require_auth_for_metrics_endpoint: false

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  store_model_in_db: false
  maximum_spend_logs_retention_period: "90d"
