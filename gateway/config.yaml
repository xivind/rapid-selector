      model: openrouter/openai/gpt-oss-120b
      api_key: os.environ/RAPIDSELECTOR_OPENROUTER_KEY
      max_tokens: 8192
      # This endpoint's price changed three times on 2026-11-03/04; check-prices.sh catches it.
      input_cost_per_token: 0.000000026
      output_cost_per_token: 0.000000095
      extra_body:
        provider:
          order: ["primeintellect/fp4"]
          only: ["primeintellect/fp4"]
