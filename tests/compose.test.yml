# Level 1 overlay for the full stack: docker-compose.yml + tests/compose.fakes.yml + this file.
# Points the gateway and tower at the fake upstream, which also fakes OpenRouter's management API.
name: rapidselector-test

services:
  gateway:
    environment:
      OPENROUTER_API_BASE: http://fake-upstream:8000/v1
    depends_on:
      fake-upstream:
        condition: service_healthy

  fake-upstream:
    environment:
      FAKE_MANAGEMENT_KEY: ${OPENROUTER_MANAGEMENT_KEY}
      FAKE_INFERENCE_KEY_NAME: ${OPENROUTER_INFERENCE_KEY_NAME:-rapidselector-gateway}

  tower:
    environment:
      TOWER_GATEWAY_URL: http://gateway:4000
      OPENROUTER_API_BASE_URL: http://fake-upstream:8000/api/v1
