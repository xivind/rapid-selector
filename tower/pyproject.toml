[project]
name = "rapidselector-tower"
version = "0.1.0"
description = "Control tower for the rapid-selector gateway"
requires-python = ">=3.14"
dependencies = [
  "fastapi==0.161.1",
  "uvicorn==0.54.0",
  "jinja2==3.1.6",
  "peewee==4.5.3",
  "httpx==0.28.1",
  "prometheus-client==0.26.0",
  "pyyaml==6.0.3",
  "python-multipart==0.0.32",
  "itsdangerous==2.2.0",
]

[dependency-groups]
dev = ["pytest==9.1.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
