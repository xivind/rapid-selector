# An example gateway config (LiteLLM) for rapid-selector. Copy it to config/gateway.yaml and
# edit it there: config/gateway.yaml is this home's own and ignored by git (config/README.md).
# The only list of models: every entry is pinned to one OpenRouter endpoint, with fallbacks
# off and zero data retention required. scripts/check-prices.sh checks every rule.
# Prices are the pinned endpoint's (USD per token), checked with scripts/check-prices.sh on
# 2026-11-12. Prices at a host change without notice: check them again before you use them.
# LiteLLM records the cost OpenRouter reports when a response carries one; these prices
# are the fallback that keeps spend above zero if it does not.
# The role chat-tasks must exist in every home: Open WebUI makes its background calls
# (titles) with it. Point it at your cheapest model.
# litellm_settings.max_budget is the global budget: the team budgets in config/home.env must
# add up to no more than it.

model_list:
  # --- Roles (permanent use) ---
  - model_name: chat-tasks
    litellm_params:
      model: openrouter/meta-llama/llama-3.1-8b-instruct
      api_key: os.environ/RAPIDSELECTOR_OPENROUTER_KEY
      max_tokens: 2048
      input_cost_per_token: 0.00000002
      output_cost_per_token: 0.00000004
      extra_body:
        provider:
          order: ["deepinfra/fp8"]
          only: ["deepinfra/fp8"]
          allow_fallbacks: false
          zdr: true
          data_collection: deny
    model_info:
      rapidselector_kind: role
      reasoning: false

  # --- Experiment names (chat and the arena), smallest to largest ---
  - model_name: gpt-oss-120b@coreweave
    litellm_params:
      model: openrouter/openai/gpt-oss-120b
      api_key: os.environ/RAPIDSELECTOR_OPENROUTER_KEY
      max_tokens: 8192
      input_cost_per_token: 0.00000003
      output_cost_per_token: 0.00000017
      extra_body:
        provider:
          order: ["coreweave/fp4"]
          only: ["coreweave/fp4"]
          allow_fallbacks: false
          zdr: true
          data_collection: deny
    model_info:
      rapidselector_kind: experiment
      reasoning: true
  - model_name: qwen3.8-2.4t-a95b@siliconflow
    litellm_params:
      model: openrouter/qwen/qwen3.8-2.4t-a95b
      api_key: os.environ/RAPIDSELECTOR_OPENROUTER_KEY
      max_tokens: 8192
      reasoning_effort: medium   # the model defaults to xhigh
      input_cost_per_token: 0.000002
      output_cost_per_token: 0.000006
      extra_body:
        provider:
          order: ["siliconflow/fp8"]
          only: ["siliconflow/fp8"]
          allow_fallbacks: false
          zdr: true
          data_collection: deny
    model_info:
      rapidselector_kind: experiment
      reasoning: true

litellm_settings:
  max_budget: 10
  budget_duration: 30d
  # request_guard (gateway/request_guard.py) strips routing fields clients could send.
  callbacks: ["prometheus", "request_guard.request_guard"]
  # Also publish health metrics for Postgres and the spend writer (litellm_postgres_* etc.).
  service_callback: ["prometheus_system"]
  require_auth_for_metrics_endpoint: false

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  store_model_in_db: false
  maximum_spend_logs_retention_period: "90d"
  # Declared here, so the file owns it: the admin UI's "Store Prompts in Spend Logs" switch is
  # then ignored, and no click puts chat contents into Postgres and its backups (principle 4).
  store_prompts_in_spend_logs: false
